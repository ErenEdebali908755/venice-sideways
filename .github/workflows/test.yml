name: Venice Sideways browser isolation
on:
  push:
    branches: ['diagnostics/live-domain-20260925']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Custom domain browser isolation
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          import datetime,json,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('diagnostics');report={'time':datetime.datetime.now(datetime.timezone.utc).isoformat(),'browsers':[]}
          with sync_playwright() as p:
              browser=p.chromium.launch()
              configs=[('custom-mobile-tr',{'viewport':{'width':390,'height':844},'locale':'tr-TR','is_mobile':True,'has_touch':True}),('custom-desktop-windows-ua',{'viewport':{'width':1440,'height':900},'locale':'en-GB','user_agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36'})]
              for name,options in configs:
                  ctx=browser.new_context(**options);page=ctx.new_page();page.set_default_timeout(15000)
                  item={'name':name,'errors':[],'failed_requests':[]}
                  page.on('pageerror',lambda e,r=item:r['errors'].append(str(e)))
                  page.on('requestfailed',lambda e,r=item:r['failed_requests'].append({'url':e.url,'error':e.failure}))
                  try:
                      response=page.goto('https://venicesideways.com/',wait_until='domcontentloaded',timeout=25000)
                      item['status']=response.status
                      page.wait_for_function('window.WalkI18n?.ready')
                      page.wait_for_function('typeof map!=="undefined" && !!map && !!document.querySelector(".maplibregl-canvas")',timeout=25000)
                      page.wait_for_timeout(5000)
                      item['main_count']=page.evaluate('stops().length');item['language']=page.locator('html').get_attribute('lang')
                      item['map_error_visible']=page.locator('#map-error').is_visible()
                      item['hidden_errors_text']=page.locator('#map-error').text_content()
                      page.screenshot(path=str(out/(name+'.png')))
                      selector='#mobile-route' if options.get('is_mobile') else '#route'
                      page.select_option(selector,'full');item['full_count']=page.locator('#stops>li').count()
                      page.select_option(selector,'main')
                      if options.get('is_mobile'):
                          page.locator('.guide-dock [data-guide-view="ideas"]').click()
                      before=page.locator('#photo-stop-lucia .prompt-count').text_content()
                      page.locator('#photo-stop-lucia .phone-next').click()
                      item['idea_changed']=before!=page.locator('#photo-stop-lucia .prompt-count').text_content()
                      item['end_url']=page.url
                  except Exception as e:item['error']=str(e)
                  report['browsers'].append(item);ctx.close()
              ctx=browser.new_context();page=ctx.new_page();console=[]
              page.on('console',lambda e:console.append({'type':e.type,'text':e.text}))
              page.set_content('<!doctype html><html><body><h1>Embedding diagnostic only</h1><iframe title="site" src="https://venicesideways.com/" width="1000" height="650"></iframe></body></html>')
              page.wait_for_timeout(4000)
              report['embedded']={'console':console,'frame_urls':[f.url for f in page.frames],'explanation':'A generic iframe test only; this does not establish whether the user opened an iframe.'}
              page.screenshot(path=str(out/'embedded-policy.png'));ctx.close();browser.close()
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sideways-browser-isolation
          path: diagnostics/
          retention-days: 3
